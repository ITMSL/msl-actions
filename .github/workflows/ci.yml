name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Skripte testen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Versionsberechnung testen
        run: bash .github/actions/next-version/next-version.test.sh
      - name: Flyway-Guard testen
        run: bash .github/actions/flyway-guard/flyway-guard.test.sh
      - name: Flyway-Guard Leer-Tag-Pruefung testen
        run: bash .github/actions/flyway-guard/pruefe-leere-tagliste.test.sh
      - name: flyway-guard geaenderte-migrationen testen
        run: bash .github/actions/flyway-guard/geaenderte-migrationen.test.sh
      - name: Release-Tags testen
        run: bash .github/actions/release-tags/release-tags.test.sh
      - name: Deploy-Stack Zielaufloesung testen
        run: bash .github/scripts/deploy-stack/ziel-aufloesen.test.sh
      - name: Deploy-Stack Vorschau testen
        run: bash .github/scripts/deploy-stack/vorschau.test.sh
      - name: Deploy-Stack Verifikation testen
        run: bash .github/scripts/deploy-stack/verifizieren.test.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Ist-Extraktor Modell testen
        run: node --test '.github/actions/ist-extraktor/test/modell.test.mjs'
      - name: Ist-Extraktor Normalisierung testen
        run: node --test '.github/actions/ist-extraktor/test/normalisierung.test.mjs'
      - name: Ist-Extraktor Secret-Guard testen
        run: node --test '.github/actions/ist-extraktor/test/secret-guard.test.mjs'
      - name: Ist-Extraktor generische Suche testen
        run: node --test '.github/actions/ist-extraktor/test/generisch.test.mjs'
      - name: Ist-Extraktor Extraktion testen
        run: node --test '.github/actions/ist-extraktor/test/extraktion.test.mjs'
      - name: Ist-Extraktor Quarkus-Fixture testen
        run: node --test '.github/actions/ist-extraktor/test/quarkus.test.mjs'
      - name: Ist-Extraktor Node/Astro-Fixture testen
        run: node --test '.github/actions/ist-extraktor/test/node-astro.test.mjs'
      - name: Ist-Extraktor Regeln testen
        run: node --test '.github/actions/ist-extraktor/test/regeln.test.mjs'
      - name: Ist-Extraktor CLI testen
        run: node --test '.github/actions/ist-extraktor/test/cli.test.mjs'
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color
      - name: shellcheck der extrahierten Skripte
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint shellcheck rhysd/actionlint:1.7.7 -s bash .github/scripts/deploy-stack/*.sh .github/actions/*/*.sh
