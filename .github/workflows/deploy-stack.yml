name: Deploy stack

on:
  workflow_call:
    inputs:
      stack:
        description: 'Portainer-Stack-Name'
        required: true
        type: string
      version:
        description: 'Zielversion (CalVer 2026.08.02-1 oder SemVer 1.4.2)'
        required: true
        type: string
      public_healthz_url:
        description: >-
          Oeffentliche /healthz-URL des Dienstes, falls vorhanden (fuer die
          schemaVoraus-Anzeige in der Job-Summary nach einem Rollback ueber
          eine additive Migration). Leer lassen, wenn nicht oeffentlich
          erreichbar -- der Schritt liest das Feld dann einfach nicht.
        required: false
        type: string
        default: ''
      ssh_host:
        description: 'Hostname oder IP des Zielservers.'
        required: true
        type: string
      ssh_port:
        description: 'SSH-Port des Zielservers.'
        required: true
        type: string
      ssh_user:
        description: 'SSH-User, an den das erzwungene Deploy-Kommando gebunden ist.'
        required: true
        type: string
      gate_bestaetigung:
        description: >-
          Pflicht-Beleg, dass das Staging-Gate fuer diesen Stand gefahren
          wurde, z.B. "Kern 27/27, 2026-08-25". Reines Honor-System: erzwingt
          die Spur im Run, nicht das Gate selbst (bewusste Grenze, siehe
          msl-workspace docs/release-gate-staging.md).
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true

# github.repository ist im aufgerufenen Workflow das AUFRUFENDE Repo -- die
# Sperre wirkt also je Dienst, nicht global.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Ausrollen und verifizieren
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STACK: ${{ inputs.stack }}
      ZIEL: ${{ inputs.version }}
      SSH_HOST: ${{ inputs.ssh_host }}
      SSH_PORT: ${{ inputs.ssh_port }}
      SSH_USER: ${{ inputs.ssh_user }}
    steps:
      - name: Gate-Beleg pruefen
        env:
          GATE: ${{ inputs.gate_bestaetigung }}
        run: |
          set -euo pipefail
          [ -n "$(echo "$GATE" | xargs)" ] || { echo "gate_bestaetigung fehlt -- Deploy ohne Gate-Beleg"; exit 1; }
          echo "**Gate-Beleg:** $GATE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@v7
        with:
          repository: ITMSL/msl-actions
          path: .msl-actions

      - name: SSH vorbereiten
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Immer mit abschliessendem Zeilenumbruch schreiben: ein OpenSSH-Key
          # ohne diesen letzten \n scheitert beim Laden ("error in libcrypto"),
          # ein zusaetzlicher (falls das Secret selbst schon einen trägt) ist
          # dagegen unschaedlich -- also lieber immer anhaengen als riskieren.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Zielversion aufloesen
        id: ziel
        run: bash .msl-actions/.github/scripts/deploy-stack/ziel-aufloesen.sh

      - name: Vorschau
        id: vorschau
        env:
          CALVER: ${{ steps.ziel.outputs.calver }}
          SSH_CMD: ssh -i ~/.ssh/deploy -p ${{ inputs.ssh_port }} ${{ inputs.ssh_user }}@${{ inputs.ssh_host }}
        run: bash .msl-actions/.github/scripts/deploy-stack/vorschau.sh

      - name: Setzen
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set $STACK ${{ steps.ziel.outputs.calver }}"

      - name: Verifizieren
        env:
          CALVER: ${{ steps.ziel.outputs.calver }}
          SOLL: ${{ steps.ziel.outputs.commit }}
          ALT: ${{ steps.vorschau.outputs.alt }}
          PUBLIC_HEALTHZ_URL: ${{ inputs.public_healthz_url }}
          SSH_CMD: ssh -i ~/.ssh/deploy -p ${{ inputs.ssh_port }} ${{ inputs.ssh_user }}@${{ inputs.ssh_host }}
        run: bash .msl-actions/.github/scripts/deploy-stack/verifizieren.sh
