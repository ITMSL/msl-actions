services:
  app:
    image: example/app:1
    environment:
      - GEO_SERVICE_URL=http://geo-service:8083
      - SECRET_X=abc
      - API_TOKEN_URL=https://token.example.org/x
      - PARTNER_F_URL=${PARTNER_F_URL:-https://partner-f.example.org/api}
      - PARTNER_G_URL=${PARTNER_G_URL}
      - PARTNER_I_URL=${PARTNER_I_URL:-}
      - FLAG=${FLAG}
    healthcheck:
      url: http://localhost:8080/health
  worker:
    image: example/worker:1
    environment:
      API_TOKEN_URL: https://token.example.org/y
      PARTNER_E_URL: http://partner-e:9000
      MAILER_HOST: ${SMTP_HOST}
      DB_URL: jdbc:postgresql://db.example.org:5432/x
      QUARKUS_DATASOURCE_JDBC_URL: ${QUARKUS_DATASOURCE_JDBC_URL:-jdbc:postgresql://postgres:5432/x}
