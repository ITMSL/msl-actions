name: 'Git-Tags und GitHub-Release'
description: 'Setzt den CalVer-Tag, bei Bedarf den SemVer-Tag, und legt das Release an.'

inputs:
  calver:
    description: 'Technische Version, z.B. 2026.08.02-1'
    required: true
  semver:
    description: 'Offizielle Version, z.B. 1.4.2'
    required: true
  semver_changed:
    description: 'true, wenn der SemVer-Tag gesetzt werden soll'
    required: true
  token:
    description: 'Token fuer die Git-Data-API und gh release create'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CALVER: ${{ inputs.calver }}
        SEMVER: ${{ inputs.semver }}
        SEMVER_CHANGED: ${{ inputs.semver_changed }}
        # Explizit der Commit, fuer den dieser Workflow-Lauf ausgeloest wurde --
        # nicht der lokale HEAD des Checkouts. Vorherige Steps im selben Job
        # (z.B. ein Badge-Commit) koennen den lokalen HEAD weiterschieben;
        # ein Tag ohne Commit-Angabe wuerde dann den falschen Commit taggen.
        TARGET_SHA: ${{ github.sha }}
      run: bash "${{ github.action_path }}/release-tags.sh"
